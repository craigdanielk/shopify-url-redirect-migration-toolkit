[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "url-migration-toolkit"
version = "0.1.0"
description = "Config-driven URL migration toolkit for CMS-to-Shopify redirects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer[all]>=0.15.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9.0",
]

[project.scripts]
migrate = "migrate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/migrate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

# Turm Kaffee — Magento-to-Shopify URL Migration
# First client configuration proving the toolkit works.

# ── Project ──────────────────────────────────────────────────
project:
  name: "turm-kaffee"
  description: "Magento-to-Shopify redirect mapping for Turm Kaffee (CH/DE/AT)"

# ── Source Platform: Magento 2 ───────────────────────────────
source:
  platform: magento
  domains:
    - "shop.turmkaffee.ch"
    - "turmkaffee.de"
    - "turmkaffee.at"
  api:
    base_url: "https://shop.turmkaffee.ch/rest/V1"
    consumer_key: "${MAGENTO_CONSUMER_KEY}"
    consumer_secret: "${MAGENTO_CONSUMER_SECRET}"
    access_token: "${MAGENTO_API_TOKEN}"
    access_token_secret: "${MAGENTO_ACCESS_TOKEN_SECRET}"

# ── Target Platform: Shopify ─────────────────────────────────
target:
  platform: shopify
  domain: "shop.turmkaffee.ch"
  api:
    store_url: "${SHOPIFY_STORE_URL}"
    access_token: "${SHOPIFY_ACCESS_TOKEN}"
    api_version: "2024-10"

# ── URL Normalization ────────────────────────────────────────
normalizer:
  strip_extensions:
    - ".html"
    - ".htm"
  strip_params:
    - "utm_source"
    - "utm_medium"
    - "utm_campaign"
    - "utm_content"
    - "utm_term"
    - "gclid"
    - "fbclid"
    - "SID"
    - "___store"
  trailing_slash: "strip"
  lowercase: true

# ── Matching ─────────────────────────────────────────────────
matchers:
  pipeline:
    - exact
    - sku
    - fuzzy
    - partial
    - pattern

  fuzzy_threshold: 0.85

  # German umlaut normalization for category slugs
  slug_transforms:
    - from: "ae"
      to: "a"
    - from: "oe"
      to: "o"
    - from: "ue"
      to: "u"

  # Turm Kaffee–specific URL pattern rules
  patterns:
    # Magento product-by-ID URLs
    - match: "^/catalog/product/view/id/(\\d+)"
      action: lookup_by_id
      target_type: product

    # Magento search URLs -> Shopify search
    - match: "^/catalogsearch/"
      action: redirect
      target: "/search"

    # Magento customer account URLs -> homepage
    - match: "^/customer/"
      action: redirect
      target: "/"

    # Magento checkout URLs -> cart
    - match: "^/checkout/"
      action: redirect
      target: "/cart"

    # Discontinued products -> collections page
    # (ristretto and tea probierbox are no longer available)
    - match: "^/(ristretto|tea-probierbox)"
      action: redirect
      target: "/collections/all"
      target_type: collection

# ── Explicit CMS Page Mappings ───────────────────────────────
page_mappings:
  agb: "/pages/agb"
  impressum: "/pages/impressum"
  datenschutz: "/pages/datenschutz"
  kontakt: "/pages/kontakt"
  about: "/pages/about"
  faq: "/pages/faq"
  ueber-uns: "/pages/about"
  lieferung: "/pages/lieferung"
  zahlung: "/pages/zahlung"
  widerruf: "/pages/widerruf"

# ── Redirect Defaults ────────────────────────────────────────
redirects:
  default_type: 301
  max_per_batch: 10000

# ── Output ───────────────────────────────────────────────────
output:
  directory: "output"
  csv_columns:
    source: "Redirect from"
    target: "Redirect to"

# ── Validation ───────────────────────────────────────────────
validation:
  request_timeout: 15
  rate_limit_delay: 0.3
  max_chain_depth: 10
  old_domains:
    - "turmkaffee.de"
    - "turmkaffee.at"
    - "turmkaffee.ch"

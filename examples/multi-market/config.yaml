# Example: Multi-market bilingual migration
# A Swiss store with German (de-CH) and English (en-GB) markets.

project:
  name: bilingual-migration
  description: "Multi-market store migration with locale prefixes"

source:
  platform: csv
  domains:
    - old-store.ch
    - www.old-store.ch
  csv_file: source_urls.csv
  csv_columns:
    url: source_url
    type: resource_type
    name: name

target:
  platform: shopify
  domain: new-store.myshopify.com
  api:
    store_url: new-store.myshopify.com
    access_token: ${SHOPIFY_ACCESS_TOKEN}
    api_version: "2024-10"

discover:
  enabled: true
  sitemap_url: https://old-store.ch/sitemap.xml

# Multi-market configuration
markets:
  - locale: de
    prefix: /de
    hreflang: de-CH
    source_domains:
      - old-store.ch
  - locale: en
    prefix: /en
    hreflang: en-GB
    source_domains:
      - old-store.ch

normalizer:
  strip_extensions: [".html", ".htm", ".php"]
  strip_params: [utm_source, utm_medium, utm_campaign, gclid, fbclid]
  trailing_slash: strip
  lowercase: true

matchers:
  pipeline: [exact, sku, fuzzy, partial, pattern]
  fuzzy_threshold: 0.85
  slug_transforms:
    # German umlaut handling
    - from: ä
      to: ae
    - from: ö
      to: oe
    - from: ü
      to: ue
    - from: ß
      to: ss

page_mappings:
  # German pages
  kontakt: /pages/contact
  ueber-uns: /pages/about
  impressum: /pages/imprint
  datenschutz: /policies/privacy-policy
  agb: /policies/terms-of-service
  # English pages
  contact: /pages/contact
  about-us: /pages/about
  privacy: /policies/privacy-policy

output:
  directory: output
  csv_columns:
    source: "Redirect from"
    target: "Redirect to"

upload:
  batch_size: 50
  pause_between_batches: 2.0
  skip_existing: true
  flatten_chains: true

validation:
  request_timeout: 15
  rate_limit_delay: 0.3
  max_chain_depth: 10
  old_domains:
    - old-store.ch
    - www.old-store.ch
